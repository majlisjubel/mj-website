<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 1.2rem;
      margin: 20px 0 10px;
      font-weight: bold;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .card-product {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card-product:hover {
      transform: translateY(-3px);
    }
    .card-image-wrapper {
      position: relative;
      width: 100%;
      height: 140px;
      background: #eee;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge-game {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
    }
    .card-body {
      padding: 12px;
    }
    .card-header-badge {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .badge-tag {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-soldout {
      background: #ffebee;
      color: #c62828;
    }
    .nokos-badge-game {
      font-size: 0.7rem;
      color: #666;
    }
    .card-title {
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .card-price {
      font-weight: bold;
      color: #007bff;
    }
    
    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-title { margin-bottom: 10px; }
    .modal-price { font-size: 1.2rem; color: #007bff; font-weight: bold; margin-bottom: 10px; }
    .modal-desc { font-size: 0.9rem; color: #555; margin-bottom: 15px; white-space: pre-wrap; }
    .btn-buy {
      display: block;
      width: 100%;
      padding: 10px;
      background: #25d366;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="other-products-title" class="section-title">Daftar Produk</div>
    <div id="product-container" class="grid-container"></div>
  </div>

  <!-- Modal Produk -->
  <div id="product-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modal-title" class="modal-title"></h3>
      <div id="modal-price" class="modal-price"></div>
      <p id="modal-desc" class="modal-desc"></p>
      <a id="modal-buy-btn" href="#" target="_blank" class="btn-buy">Beli via WhatsApp</a>
    </div>
  </div>

  <script>
    // 1. Konfigurasi Supabase Kamu
    const SUPABASE_URL = "https://YOUR_SUPABASE_URL.supabase.co"; // Ganti dengan URL Supabase milikmu
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";           // Ganti dengan Anon Key milikmu
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allProducts = [];
    let currentCategory = "Beranda";

    // 2. Mengambil data dari tabel Supabase
    async function fetchProducts() {
      try {
        const { data, error } = await supabase
          .from('products') // Sesuaikan nama tabel jika berbeda
          .select('*');

        if (error) {
          console.error("Gagal mengambil data produk:", error);
          return;
        }

        allProducts = data || [];
        renderProducts("");
      } catch (err) {
        console.error("Terjadi kesalahan:", err);
      }
    }

    // 3. Menampilkan produk ke HTML
    function renderProducts(keyword) {
      const container = document.getElementById("product-container");
      const titleEl = document.getElementById("other-products-title");

      const filtered = allProducts.filter(p => {
        const name = (p.name || "").toLowerCase();
        const cat = (p.category || "").toLowerCase();
        const desc = (p.description || "").toLowerCase();
        
        const matchesSearch = name.includes(keyword) || cat.includes(keyword) || desc.includes(keyword);
        const matchesCat = (currentCategory === "Beranda") || cat.includes(currentCategory.toLowerCase()) || name.includes(currentCategory.toLowerCase());

        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        titleEl.style.display = "none";
        container.innerHTML = "<p>Produk tidak ditemukan.</p>";
        return;
      }

      titleEl.style.display = "block";
      container.innerHTML = filtered.map(p => {
        const name = p.name || "Produk Tanpa Nama";
        const category = p.category || "PRODUK";
        const stock = (p.stock !== undefined && p.stock !== null) ? Number(p.stock) : 0;
        const isAvailable = stock > 0;
        
        let priceDisplay = "Cek Stok";
        if (p.price && Number(p.price) > 0) {
          priceDisplay = "Rp " + Number(p.price).toLocaleString("id-ID");
        }

        const imgUrl = (p.image_url && p.image_url.trim() !== "") ? p.image_url : "";

        let imageHTML = "";
        if (imgUrl) {
          imageHTML = `
            <div class="card-image-wrapper">
              <img src="${imgUrl}" alt="${name}" class="card-img" loading="lazy" onerror="this.onerror=null; this.parentElement.style.display='none';">
              <span class="badge-game">${category}</span>
            </div>
          `;
        }

        const badgeClass = isAvailable ? "badge-tag" : "badge-tag badge-soldout";
        const badgeText = isAvailable ? `STOK: ${stock}` : "SOLD OUT";

        // MENGGUNAKAN openProductById UNTUK MENGHINDARI ERROR ENTER/PETIK TEKS
        return `
          <div class="card-product" onclick="openProductById('${p.id}')">
            ${imageHTML}
            <div class="card-body">
              ${!imgUrl ? `
                <div class="card-header-badge">
                  <span class="${badgeClass}">${badgeText}</span>
                  <span class="nokos-badge-game">${category}</span>
                </div>
              ` : `<span class="${badgeClass}">${badgeText}</span>`}
              <h3 class="card-title">${name}</h3>
              <div class="card-price">${priceDisplay}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    // 4. Helper untuk membuka modal berdasarkan ID produk secara aman
    function openProductById(productId) {
      const p = allProducts.find(item => String(item.id) === String(productId));
      if (!p) return;

      const name = p.name || "Produk Tanpa Nama";
      const desc = p.description || "Belum ada deskripsi";
      const category = p.category || "PRODUK";
      const stock = (p.stock !== undefined && p.stock !== null) ? Number(p.stock) : 0;
      
      let priceDisplay = "Cek Stok";
      if (p.price && Number(p.price) > 0) {
        priceDisplay = "Rp " + Number(p.price).toLocaleString("id-ID");
      }

      openModal(name, desc, priceDisplay, stock, category);
    }

    // 5. Fungsi membuka modal detail produk
    function openModal(name, desc, price, stock, category) {
      document.getElementById("modal-title").innerText = name;
      document.getElementById("modal-price").innerText = price;
      document.getElementById("modal-desc").innerText = desc;
      
      const adminPhone = "6281234567890"; // Ganti dengan nomor WA kamu
      const message = `Halo admin, saya ingin membeli ${name} (${category}) seharga ${price}. Apakah stok masih ada?`;
      
      const buyBtn = document.getElementById("modal-buy-btn");
      buyBtn.href = `https://wa.me/${adminPhone}?text=${encodeURIComponent(message)}`;
      
      if (stock <= 0) {
        buyBtn.innerText = "Stok Habis";
        buyBtn.style.background = "#ccc";
        buyBtn.style.pointerEvents = "none";
      } else {
        buyBtn.innerText = "Beli via WhatsApp";
        buyBtn.style.background = "#25d366";
        buyBtn.style.pointerEvents = "auto";
      }

      document.getElementById("product-modal").classList.add("active");
    }

    // 6. Fungsi menutup modal
    function closeModal() {
      document.getElementById("product-modal").classList.remove("active");
    }

    // Tutup modal jika user mengklik area luar modal
    window.onclick = function(event) {
      const modal = document.getElementById("product-modal");
      if (event.target === modal) {
        closeModal();
      }
    };

    // Jalankan ambil data saat halaman dimuat
    fetchProducts();
  </script>
</body>
</html>
